<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>CodeClash</title>
    <link rel="stylesheet" href="./game.css" />
  </head>

  <body>
    <div class="timer" id="timer">Waiting for the start…</div>
    <div class="editor" id="editor"></div>
    <details class="test-result" id="testResultPanel" hidden>
      <summary class="test-result__summary" id="testResultSummary"></summary>
      <button class="test-result__close" id="testResultClose" type="button" aria-label="Hide test result">×</button>
      <pre class="test-result__body" id="testResultBody"></pre>
    </details>
    <button class="runCode" id="runCode" hidden>► Run</button>
    <img class="reference-image" id="ref" alt="" />

    <script src="./game.js" type="module"></script>
  </body>
</html>
